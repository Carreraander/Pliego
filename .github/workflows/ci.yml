name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf \
            libtesseract-dev libleptonica-dev tesseract-ocr-eng tesseract-ocr-spa tesseract-ocr-osd
      # Compilar Tesseract con vcpkg tarda ~20 min: se restaura el árbol `installed` con una clave fija (no depende de
      # la rama ni del script) y se guarda justo tras instalar, aunque fallen los pasos siguientes. Los PR leen la caché
      # de main (la que guarda su push a main); la de un PR solo la ven sus propios pushes.
      - name: Caché de vcpkg (Tesseract, Windows)
        id: vcpkg-cache
        if: matrix.os == 'windows-latest'
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-tesseract-x64-windows-release-v1
      - name: Tesseract (Windows, vcpkg)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tools/ocr/setup-tesseract-windows.ps1 -GithubEnv $env:GITHUB_ENV -GithubPath $env:GITHUB_PATH -TessdataDir "$env:RUNNER_TEMP\tessdata"
      - name: Guardar caché de vcpkg
        if: matrix.os == 'windows-latest' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-tesseract-x64-windows-release-v1
      - name: Formato
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # Motor PDFium de pliego-pdf (W37): se descarga la versión fijada en tools/pdfium/pdfium.lock.json (hash verificado)
      # y las pruebas del motor la cargan por ruta absoluta con PLIEGO_PDFIUM_DLL. Solo este paso la define: el resto
      # de pruebas (worker, app) siguen con MuPDF, que es el motor por defecto sin la DLL.
      - name: PDFium (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          url=$(jq -r '.fuente' tools/pdfium/pdfium.lock.json)/download/$(jq -r '.version' tools/pdfium/pdfium.lock.json | sed 's#/#%2F#')/$(jq -r '.linux_x64_asset' tools/pdfium/pdfium.lock.json)
          curl -sSfL -o "$RUNNER_TEMP/pdfium.tgz" "$url"
          echo "$(jq -r '.linux_x64_sha256' tools/pdfium/pdfium.lock.json)  $RUNNER_TEMP/pdfium.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pdfium" && tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium"
          echo "PLIEGO_PDFIUM_DLL=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: PDFium (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./tools/pdfium/fetch-pdfium.ps1 -OutDir "$env:RUNNER_TEMP\pdfium"
          "PLIEGO_PDFIUM_DLL=$env:RUNNER_TEMP\pdfium\pdfium.dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Pruebas del motor PDFium
        run: cargo test -p pliego-pdf --features pdfium --test pdfium -- --nocapture

  licenses:
    name: Licencias de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  frontend:
    name: Frontend (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint --if-present
      - name: Tests unitarios
        run: npm test --if-present
      - name: Build
        run: npm run build
      - name: Navegador de Playwright
        if: hashFiles('app/playwright.config.*') != ''
        run: npx playwright install --with-deps chromium
      - name: Tests visuales y de accesibilidad
        if: hashFiles('app/playwright.config.*') != ''
        run: npm run test:e2e --if-present

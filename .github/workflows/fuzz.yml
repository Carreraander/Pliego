name: fuzz

# Fuzzing nocturno del motor (lopdf y PDFium; ver tools/fuzz.sh). No toca ci.yml.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Segundos por objetivo"
        default: "3600"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev clang
      - name: PDFium
        run: |
          url=$(jq -r '.fuente' tools/pdfium/pdfium.lock.json)/download/$(jq -r '.version' tools/pdfium/pdfium.lock.json | sed 's#/#%2F#')/$(jq -r '.linux_x64_asset' tools/pdfium/pdfium.lock.json)
          curl -sSfL -o "$RUNNER_TEMP/pdfium.tgz" "$url"
          echo "$(jq -r '.linux_x64_sha256' tools/pdfium/pdfium.lock.json)  $RUNNER_TEMP/pdfium.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pdfium" && tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium"
          echo "PLIEGO_PDFIUM_DLL=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Rust nightly (solo para este job)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/pliego-engine/fuzz/target
          key: fuzz-${{ hashFiles('crates/pliego-engine/fuzz/Cargo.toml') }}
      - name: Fuzzing
        run: tools/fuzz.sh "${{ inputs.seconds || '3600' }}"
      - name: Subir fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/pliego-engine/fuzz/artifacts/
          if-no-files-found: ignore

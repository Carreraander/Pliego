[workspace]
resolver = "3"
members = ["crates/*", "app/service", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Carreraander/Pliego"
authors = ["Proyecto Pliego"]

[workspace.dependencies]
pliego-core = { path = "crates/pliego-core" }
pliego-engine = { path = "crates/pliego-engine" }
pliego-pdf = { path = "crates/pliego-pdf" }
pliego-organize = { path = "crates/pliego-organize" }
pliego-a11y = { path = "crates/pliego-a11y" }
pliego-pdfa = { path = "crates/pliego-pdfa" }
pliego-print = { path = "crates/pliego-print" }
pliego-stamp = { path = "crates/pliego-stamp" }
# PDFium (render, texto y búsqueda; W37). Lo usa `pliego-pdf`. Sin `image_*` (no
# queremos la crate `image`), con `thread_safe` (serializa todas las llamadas a la DLL con un cerrojo global) y la API
# de `pdfium_8125`, la más alta que conoce la crate; la DLL fijada (chromium/8138) es posterior y compatible.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# El arnés de comparación (pliego-qa) recorre millones de píxeles: sin optimizar tarda un minuto en las pruebas.
[profile.dev.package.pliego-qa]
opt-level = 3

[workspace]
resolver = "3"
members = ["crates/*", "app/service", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Carreraander/Pliego"
authors = ["Proyecto Pliego"]

[workspace.dependencies]
pliego-core = { path = "crates/pliego-core" }
pliego-engine-mupdf = { path = "crates/pliego-engine-mupdf" }
pliego-organize = { path = "crates/pliego-organize" }
pliego-stamp = { path = "crates/pliego-stamp" }
# Sin la característica `tesseract` de MuPDF: incluye su propio Tesseract/Leptonica estático y choca por símbolos
# con el Tesseract que enlaza `pliego-ocr` (provoca SIGSEGV al iniciar el OCR). El resto son las de por defecto.
mupdf = { version = "0.8", default-features = false, features = [
  "js", "xps", "svg", "cbz", "img", "html", "epub", "system-fonts", "brotli", "docx-output", "base14-fonts",
] }
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

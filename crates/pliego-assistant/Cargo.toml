[package]
name = "pliego-assistant"
description = "Asistente local: resumir, preguntar y extraer datos de un documento sin enviar nada fuera"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Motor llama.cpp (compila C++ con CMake). Desactivado por defecto.
llama = ["dep:llama-cpp-2"]
# Descarga de modelos bajo demanda (única parte con red; solo la usa la persona al pulsar «Descargar»).
download = ["dep:pliego-net", "dep:sha2"]

[dependencies]
llama-cpp-2 = { version = "0.1.160", optional = true }
pliego-core.workspace = true
regex = "1"
sha2 = { version = "0.10", optional = true }
pliego-net = { path = "../pliego-net", optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

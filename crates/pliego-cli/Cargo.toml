[package]
name = "pliego-cli"
description = "Línea de comandos de Pliego"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pliego"
path = "src/main.rs"

[features]
# Motor llama.cpp para `pliego assistant ask|summarize` (compila C++ con CMake).
llama = ["pliego-assistant/llama"]

[dependencies]
pliego-core.workspace = true
pliego-engine.workspace = true
pliego-pdf.workspace = true
pliego-sign = { path = "../pliego-sign" }
pliego-signflow = { path = "../pliego-signflow" }
pliego-compare = { path = "../pliego-compare" }
pliego-optimize = { path = "../pliego-optimize" }
pliego-organize.workspace = true
pliego-stamp.workspace = true
pliego-protect = { path = "../pliego-protect" }
serde.workspace = true
pliego-annot = { path = "../pliego-annot" }
pliego-forms = { path = "../pliego-forms" }
pliego-formdesign = { path = "../pliego-formdesign" }
pliego-print = { path = "../pliego-print" }
pliego-assistant = { path = "../pliego-assistant", features = ["download"] }
pliego-convert = { path = "../pliego-convert" }
pliego-document = { path = "../pliego-document" }
pliego-edit = { path = "../pliego-edit" }
pliego-office-export = { path = "../pliego-office-export" }
pliego-redact = { path = "../pliego-redact" }
pliego-a11y = { path = "../pliego-a11y" }
pliego-pdfa = { path = "../pliego-pdfa" }
# Proceso hijo de las herramientas de la app (`pliego __job`, hueco 1.0 n.º 7): comparte el despachador con la app.
pliego-app-service = { path = "../../app/service" }

# ── Ranuras: añade tu línea justo debajo de tu marca (evita conflictos entre flujos) ──
# [W06 ocr]
pliego-ocr = { path = "../pliego-ocr" }

# [W11 edit]

# [W14 office]

# [W15 run e índice]
pliego-actions = { path = "../pliego-actions" }
pliego-steps = { path = "../pliego-steps", features = ["ocr"] }
pliego-index = { path = "../pliego-index" }
pliego-measure = { path = "../pliego-measure" }
pliego-portfolio = { path = "../pliego-portfolio" }

# [W13/W17/W12 extra]

# [libre A]

# [libre B]

anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
regex = "1"
sys-locale = "0.3"
tempfile.workspace = true

[dev-dependencies]
rcgen = "0.14"
p12-keystore = "0.4"

[lints]
workspace = true

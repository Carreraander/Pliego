[package]
name = "pliego-convert"
description = "Crear PDF desde otros formatos y exportar PDF a formatos comunes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pliego-core.workspace = true
pliego-pdf.workspace = true
serde.workspace = true
tempfile.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
# CBZ, EPUB y XPS son paquetes ZIP (OPC): `zip` los lee y `roxmltree` analiza su XML. Ya los usa `pliego-office-export`.
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"

[dev-dependencies]
tiff = "0.11"
serde_json.workspace = true

[lints]
workspace = true

[package]
name = "pliego-engine-mupdf-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pliego-core = { path = "../../pliego-core" }
pliego-engine-mupdf = { path = ".." }

# Fuera del workspace principal: se compila solo con `cargo +nightly fuzz`.
[workspace]

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false

[[bin]]
name = "render_page0"
path = "fuzz_targets/render_page0.rs"
test = false
doc = false

[[bin]]
name = "extract_text"
path = "fuzz_targets/extract_text.rs"
test = false
doc = false

[[bin]]
name = "outline"
path = "fuzz_targets/outline.rs"
test = false
doc = false

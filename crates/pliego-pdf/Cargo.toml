[package]
name = "pliego-pdf"
description = "Capa propia de acceso a PDF: tipos y operaciones de Pliego sobre lopdf (objetos y guardado) y PDFium (render y texto)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pliego-core.workspace = true
# Motor de JavaScript de formularios (W42). Solo `native::formjs` lo usa.
pliego-formjs = { path = "../pliego-formjs" }
# Motor propio del modelo de objetos y del guardado (ola 5, W36). Solo `pliego-pdf` lo usa para esto.
lopdf = { version = "0.46", default-features = false }
md-5 = "0.11"
# Fuentes e imágenes del motor propio (ola 5, W39). `ttf-parser` mide y da contornos; `flate2` comprime los flujos;
# `image` decodifica PNG y JPEG (W39) y, para la conversión de imágenes a PDF (W40), también WebP, GIF y BMP.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
getrandom = "0.4"
# Redacción de píxeles en imágenes DCT (JPEG): decodifica, borra y vuelve a codificar (W38). Ya están en el árbol.
zune-jpeg = "0.5"
jpeg-encoder = "0.6"
# `tiff` lee las páginas de un TIFF (W40). Solo decodifica: el JPEG se incrusta tal cual.
tiff = "0.11"
serde.workspace = true
pdfium-render.workspace = true

# Impresión (W45): en Windows PDFium dibuja una página directamente en el HDC de la impresora (`FPDF_RenderPage`).
[target.'cfg(windows)'.dependencies]
pdfium-render = { workspace = true, features = ["pdfium_use_win32"] }
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

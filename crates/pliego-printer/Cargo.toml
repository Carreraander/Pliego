[package]
name = "pliego-printer"
description = "Impresión de PDF en impresoras de Windows: opciones, maquetación de la hoja y envío con PDFium al contexto de la impresora"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pliego-core.workspace = true
pliego-pdf.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true

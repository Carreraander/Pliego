[package]
name = "pliego-qa"
description = "Herramientas de QA de Pliego: ejecución del corpus externo con aislamiento y tiempo límite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pliego-core.workspace = true
pliego-engine.workspace = true
pliego-pdf.workspace = true
pliego-worker = { path = "../pliego-worker" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
tempfile.workspace = true
jpeg-encoder = "0.6"

[dev-dependencies]
pliego-redact = { path = "../pliego-redact" }

[lints]
workspace = true

[[bin]]
name = "corpus-runner"
path = "src/main.rs"

[[bin]]
name = "engine-compare"
path = "src/bin/engine_compare.rs"

[[bin]]
name = "redaction-oracle"
path = "src/bin/redaction_oracle.rs"

[[bin]]
name = "big-bench"
path = "src/bin/big_bench.rs"

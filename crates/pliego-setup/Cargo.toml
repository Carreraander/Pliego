[package]
name = "pliego-setup"
description = "Instalador y desinstalador de Pliego (Pliego-Setup.exe, Uninstall.exe)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pliego-install = { path = "../pliego-install" }
serde.workspace = true
serde_json.workspace = true
pliego-update = { path = "../pliego-update" }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_Globalization",
  "Win32_System_Com_Urlmon",
  "Win32_System_Console",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
pliego-update = { path = "../pliego-update", features = ["sign"] }
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "pliego-sign"
description = "Firma digital PAdES y validación de firmas para Pliego"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pliego-core.workspace = true
lopdf = { version = "0.46", default-features = false }
cms = "0.2"
x509-cert = { version = "0.2", features = ["pem"] }
der = { version = "0.7", features = ["alloc", "oid"] }
const-oid = "0.9"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
spki = "0.7"
signature = "2"
p12-keystore = "0.4"
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true
rcgen = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true

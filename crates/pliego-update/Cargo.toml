[package]
name = "pliego-update"
description = "Cliente de autoactualizaciones de Pliego: manifiestos firmados (Ed25519), canales, despliegue gradual y descarga verificada"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# Firma de manifiestos: solo la necesita la herramienta de publicación (pliego-release), no la app.
sign = []

[dependencies]
pliego-core.workspace = true
pliego-install = { path = "../pliego-install" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = "0.3"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry", "Networking_Connectivity"] }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip", "win-system-proxy"] }

[dev-dependencies]
# Las pruebas firman manifiestos de prueba con claves generadas al vuelo.
pliego-update = { path = ".", features = ["sign"] }
tempfile.workspace = true
tiny_http = "0.12"
sha2 = "0.10"
getrandom = "0.3"

[lints]
workspace = true

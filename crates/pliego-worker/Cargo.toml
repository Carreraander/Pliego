[package]
name = "pliego-worker"
description = "Proceso aislado que ejecuta el motor (lopdf + PDFium) y cliente WorkerEngine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pliego_worker"

[[bin]]
name = "pliego-worker"
path = "src/main.rs"

[dependencies]
pliego-core.workspace = true
pliego-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true

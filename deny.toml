# Licencias permitidas: todas compatibles con AGPL-3.0-or-later.
# Añadir una licencia nueva requiere aprobación del hilo de gestión.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0",
  "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later", "FTL", "0BSD",
  # IJG (Independent JPEG Group): permisiva y compatible con GPL/AGPL según la FSF. La usa jpeg-encoder
  # (pliego-optimize); MuPDF ya incluye libjpeg bajo la misma licencia. Ver THIRD-PARTY.md.
  "IJG",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pliego · Boceto del visor (W01)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f4f1ea; --surface: #fbf9f4; --surface-2: #ece8de; --line: #d9d3c4;
    --text: #25241f; --text-2: #6b675b; --accent: #1f6f6b; --accent-ink: #fff; --accent-soft: #d3e6e2;
    --hit: #f2c744; --paper: #fff; --shadow: 0 1px 2px rgb(0 0 0 / .12), 0 6px 18px rgb(0 0 0 / .10);
  }
  [data-theme="dark"] {
    --bg: #1b1c1a; --surface: #242623; --surface-2: #2d2f2b; --line: #3a3d37;
    --text: #ebe8df; --text-2: #a09c90; --accent: #5cc0b8; --accent-ink: #0d2523; --accent-soft: #24403d;
    --hit: #b8902a; --paper: #f3f1ea; --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 6px 18px rgb(0 0 0 / .4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; background: #888; color: var(--text); }
  h1 { font-size: 16px; margin: 20px 24px 0; color: #fff; }
  p.nota { margin: 4px 24px 16px; color: #eee; max-width: 70ch; }
  .frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(640px, 1fr)); gap: 24px; padding: 0 24px 24px; }
  .app { background: var(--bg); color: var(--text); height: 520px; display: grid; grid-template-rows: 36px 40px 1fr 28px;
         border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
  .tabs { display: flex; gap: 2px; padding: 4px 8px 0; background: var(--surface-2); align-items: flex-end; }
  .tab { padding: 6px 12px; border-radius: 8px 8px 0 0; color: var(--text-2); display: flex; gap: 8px; align-items: center; max-width: 180px; }
  .tab.on { background: var(--bg); color: var(--text); }
  .tab small { opacity: .6; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .btn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--text-2); }
  .btn.on { background: var(--accent-soft); color: var(--accent); }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
            border-radius: 6px; padding: 3px 8px; color: var(--text-2); min-width: 220px; }
  .search b { color: var(--text); font-weight: 500; }
  .body { display: grid; grid-template-columns: 40px 168px 1fr; min-height: 0; }
  .rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; }
  .side { border-right: 1px solid var(--line); background: var(--surface); padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .thumb { background: var(--paper); height: 92px; border-radius: 3px; box-shadow: var(--shadow); position: relative; }
  .thumb.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb i { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 11px; color: var(--text-2); }
  .canvas { position: relative; overflow: hidden; display: flex; justify-content: center; padding: 18px 0; gap: 14px; }
  .page { background: var(--paper); width: 330px; height: 440px; border-radius: 2px; box-shadow: var(--shadow); padding: 28px 26px; color: #2b2a26; }
  .page .l { height: 6px; background: #c9c5b8; border-radius: 3px; margin: 9px 0; }
  .page .h { height: 12px; width: 55%; background: #8f8a7a; border-radius: 3px; margin-bottom: 16px; }
  .page .m { background: var(--hit); height: 10px; width: 38%; border-radius: 2px; margin: 9px 0; opacity: .85; }
  .zoom { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; align-items: center;
          background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; box-shadow: var(--shadow); color: var(--text-2); }
  .zoom b { color: var(--text); font-weight: 600; min-width: 48px; text-align: center; }
  .status { display: flex; align-items: center; gap: 14px; padding: 0 12px; color: var(--text-2); font-size: 12px; border-top: 1px solid var(--line); background: var(--surface-2); }
  .status .sp { margin-left: auto; }
  svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<h1>Pliego · Boceto del visor — claro y oscuro (sigue el tema de Windows)</h1>
<p class="nota">Boceto estático para aprobación. Identidad propia: papel cálido + verde tinta, pestañas arriba, barra de herramientas fina,
raíl de paneles a la izquierda, zoom flotante abajo. Los iconos finales serán SVG libres (Lucide, ISC).</p>

<div class="frames">
<template id="app">
  <div class="app">
    <div class="tabs">
      <div class="tab on">contrato-2026.pdf <small>✕</small></div>
      <div class="tab">informe.pdf <small>✕</small></div>
      <div class="tab">＋</div>
    </div>
    <div class="bar">
      <div class="btn"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
      <div class="btn"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></div>
      <div class="sep"></div>
      <div class="btn on"><svg viewBox="0 0 24 24"><path d="M5 4h14M5 9h14M5 14h14M5 19h14"/></svg></div>
      <div class="btn"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/></svg></div>
      <div class="sep"></div>
      <div class="btn"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8m0-5v5h-5"/></svg></div>
      <div class="search"><svg viewBox="0 0 24 24" style="width:14px"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><b>cláusula</b> <span>2 de 7</span></div>
    </div>
    <div class="body">
      <div class="rail">
        <div class="btn on"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8"/></svg></div>
        <div class="btn"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></div>
        <div class="btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></div>
      </div>
      <div class="side">
        <div class="thumb"><i>1</i></div><div class="thumb on" style="margin-top:6px"><i>2</i></div><div class="thumb" style="margin-top:6px"><i>3</i></div>
      </div>
      <div class="canvas">
        <div class="page"><div class="h"></div><div class="l"></div><div class="l"></div><div class="m"></div><div class="l" style="width:80%"></div><div class="l"></div><div class="l" style="width:60%"></div></div>
        <div class="page" style="opacity:.96"><div class="l"></div><div class="l"></div><div class="l" style="width:70%"></div><div class="l"></div></div>
        <div class="zoom"><svg viewBox="0 0 24 24" style="width:14px"><path d="M5 12h14"/></svg><b>100 %</b><svg viewBox="0 0 24 24" style="width:14px"><path d="M12 5v14M5 12h14"/></svg></div>
      </div>
    </div>
    <div class="status"><span>Página 2 de 48</span><span>Desplazamiento continuo</span><span class="sp">A4 · 210 × 297 mm</span></div>
  </div>
</template>
</div>
<script>
  const t = document.getElementById('app'), frames = document.querySelector('.frames');
  for (const theme of ['light', 'dark']) {
    const div = document.createElement('div'); div.dataset.theme = theme; div.append(t.content.cloneNode(true)); frames.append(div);
  }
</script>
</body>
</html>

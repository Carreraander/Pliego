[package]
name = "pdfium-spike"
description = "Spike W35: carga dinámica de pdfium.dll, arranque, render y memoria. No forma parte del workspace."
version = "0.0.0"
edition = "2024"
license = "BUSL-1.1"
publish = false

# Crate aislado (no es miembro del workspace de Pliego): no altera Cargo.lock ni la CI.
[workspace]

[dependencies]
# Sin `thread_safe`/`sync`: el worker será un proceso con un hilo de PDFium. `pdfium_8125` fija la API que
# espera la DLL de chromium/8138 (medida en acr12, #186/#187); `pdfium_latest` es solo un alias de ella en 0.9.5.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
